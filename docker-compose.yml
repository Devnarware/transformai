services:
  backend:
    build: ./backend
    ports: ["4000:4000"]
    environment: [AI_PROVIDER=mock, CORS_ORIGIN=http://localhost:5173]
    volumes: ["tdata:/app/data"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment: [API_URL=http://backend:4000]
    depends_on: [backend]
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
volumes: {tdata: {}}
